name: Terraform

# TEST SETUP for project ipam-conn-pn20482.
# All settings are hardcoded below: no GitHub Variables or Secrets needed.
# Wiz is skipped in this test (status treats every plan as scan-passed).
# Environments tf-plan-approval and tf-apply are created automatically by
# GitHub on first use, without reviewers, so approval passes straight through.
#
# Recovery after a failed apply and the drift check are in tf-recovery.yaml.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tf-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_ROOTS_DIR: "workspace"
  SCRIPTS: ${{ github.workspace }}/.github/scripts
  TF_VERSION: "1.12.2"
  GCP_WIF_PROVIDER: "projects/839161155994/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
  GCP_TF_PLAN_SA: "tf-plan@ipam-conn-pn20482.iam.gserviceaccount.com"
  GCP_TF_APPLY_SA: "tf-apply@ipam-conn-pn20482.iam.gserviceaccount.com"
  # TEST ONLY: in a real repo this must be a repository secret.
  TF_PLAN_PASSPHRASE: "pipeline-test-only-passphrase"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Detect Changes (.github/scripts/detect-changes.sh)
  # ---------------------------------------------------------------------------
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has_changes: ${{ steps.detect.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint pipeline scripts
        if: github.event_name == 'pull_request'
        run: shellcheck .github/scripts/*.sh

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: bash "$SCRIPTS/detect-changes.sh"

  # ---------------------------------------------------------------------------
  # 2. Plan
  # ---------------------------------------------------------------------------
  plan:
    name: plan (${{ matrix.dir }})
    needs: detect-changes
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v6

      - name: Authenticate to GCP (plan SA)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_TF_PLAN_SA }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        id: init
        run: terraform init -input=false

      - name: terraform fmt
        id: fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate
        id: validate
        run: terraform validate -no-color

      - name: terraform plan
        id: plan
        run: bash "$SCRIPTS/tf-plan.sh"

      - name: Define folder status
        id: status
        if: always()
        env:
          INIT_OUT: ${{ steps.init.outcome }}
          FMT_OUT: ${{ steps.fmt.outcome }}
          VAL_OUT: ${{ steps.validate.outcome }}
          PLAN_EXIT: ${{ steps.plan.outputs.exit_code }}
          WIZ_EXIT: "0"   # Wiz skipped in this test
          STATUS_FILE: ${{ matrix.name }}.txt
        run: bash "$SCRIPTS/folder-status.sh"

      - name: Upload folder status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tf-status-${{ matrix.name }}
          path: ${{ matrix.dir }}/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Encrypt sensitive plan files
        if: always() && steps.status.outputs.status == 'ready'
        env:
          PASSPHRASE: ${{ env.TF_PLAN_PASSPHRASE }}
        run: bash "$SCRIPTS/plan-crypt.sh" encrypt

      - name: Upload plan files
        if: always() && steps.status.outputs.status == 'ready'
        uses: actions/upload-artifact@v7
        with:
          name: tf-plan-${{ matrix.name }}
          path: |
            ${{ matrix.dir }}/tfplan.gpg
            ${{ matrix.dir }}/plan.json.gpg
            ${{ matrix.dir }}/plan.txt
            ${{ matrix.dir }}/.terraform.lock.hcl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Enforce status outcome
        if: always()
        env:
          STATUS: ${{ steps.status.outputs.status }}
        run: '[ "$STATUS" = "ready" ] || [ "$STATUS" = "no_changes" ]'

  # ---------------------------------------------------------------------------
  # 3. Approval and Gate
  # ---------------------------------------------------------------------------
  approval:
    needs: [detect-changes, plan]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    environment: tf-plan-approval
    steps:
      - run: echo "Plan approved."

  terraform-gate:
    name: terraform-gate
    if: always() && github.event_name == 'pull_request'
    needs: [detect-changes, plan, approval]
    runs-on: ubuntu-24.04
    steps:
      - env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          HAS_CHANGES: ${{ needs.detect-changes.outputs.has_changes }}
          PLAN_RESULT: ${{ needs.plan.result }}
          APPROVAL_RESULT: ${{ needs.approval.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then exit 1; fi
          if [ "$HAS_CHANGES" != "true" ]; then exit 0; fi
          if [ "$PLAN_RESULT" != "success" ]; then exit 1; fi
          if [ "$APPROVAL_RESULT" != "success" ]; then exit 1; fi

      - uses: actions/download-artifact@v8
        if: needs.detect-changes.outputs.has_changes == 'true'
        with:
          pattern: tf-status-*
          path: statuses
          merge-multiple: true

      - name: Gate against unified statuses
        if: needs.detect-changes.outputs.has_changes == 'true'
        run: |
          FAIL=0
          for f in statuses/*.txt; do
            [ -e "$f" ] || continue
            STATUS=$(cat "$f")
            if [ "$STATUS" != "ready" ] && [ "$STATUS" != "no_changes" ]; then FAIL=1; fi
          done
          if [ $FAIL -ne 0 ]; then exit 1; fi

  # ---------------------------------------------------------------------------
  # 4. Push: find the approved PR run, then apply
  # ---------------------------------------------------------------------------
  find-plan-run:
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read, actions: read }
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" | jq -r '.[0].number // empty')
          [ -n "$pr" ] || { echo "::error::No PR found for $SHA. Changes must reach main through a PR."; exit 1; }
          head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha')
          wf=$(gh api "repos/$REPO/actions/runs/$GITHUB_RUN_ID" --jq '.workflow_id')
          run_id=$(gh api "repos/$REPO/actions/workflows/$wf/runs?head_sha=$head&event=pull_request&status=success&per_page=100" | jq -r '.workflow_runs | sort_by(.created_at) | last | .id // empty')
          [ -n "$run_id" ] || { echo "::error::No successful plan run found for PR #$pr."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

  apply:
    name: apply (${{ matrix.dir }})
    needs: [detect-changes, find-plan-run]
    if: github.event_name == 'push' && needs.find-plan-run.result == 'success'
    runs-on: ubuntu-24.04
    environment: tf-apply
    concurrency:
      group: tf-apply-${{ matrix.name }}   # shared with tf-recovery.yaml
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}
    permissions: { contents: read, id-token: write, actions: read }
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: tf-status-${{ matrix.name }}
          path: ${{ matrix.dir }}
          run-id: ${{ needs.find-plan-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Determine if apply is required
        env:
          STATUS_FILE: ${{ matrix.name }}.txt
        run: echo "STATUS=$(cat "$STATUS_FILE")" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        if: env.STATUS == 'ready'
        with:
          name: tf-plan-${{ matrix.name }}
          path: ${{ matrix.dir }}
          run-id: ${{ needs.find-plan-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: google-github-actions/auth@v3
        if: env.STATUS == 'ready'
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_TF_APPLY_SA }}

      - uses: hashicorp/setup-terraform@v4
        if: env.STATUS == 'ready'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        if: env.STATUS == 'ready'
        run: terraform init -input=false -lockfile=readonly

      - name: Decrypt sensitive plan files
        if: env.STATUS == 'ready'
        env:
          PASSPHRASE: ${{ env.TF_PLAN_PASSPHRASE }}
        run: bash "$SCRIPTS/plan-crypt.sh" decrypt

      - name: terraform apply
        if: env.STATUS == 'ready'
        run: terraform apply -input=false -lock-timeout=10m -no-color tfplan
